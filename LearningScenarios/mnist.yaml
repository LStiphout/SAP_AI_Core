apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mnist # executable id, must be unique across all your workflows (YAML files), please modify this to any value (e.g. code-pipeline-12345) if you are not the only user of your SAP AI Core instance.
  annotations:
    scenarios.ai.sap.com/description: "Mnist model for predicting numbers"
    scenarios.ai.sap.com/name: "Mnist model scenario"
    executables.ai.sap.com/description: "Trains model handwritten numbers"
    executables.ai.sap.com/name: "mnist model executable"
  labels:
    scenarios.ai.sap.com/id: "learning-code"
    ai.sap.com/version: "1.0"
spec:
  imagePullSecrets:
    - name: docker # your docker registry secret
  entrypoint: mnistpipeline
  templates:
  - name: mnistpipeline
    steps:
    - - name: mnistpredictor
        template: mnistcodeblock1

  - name: mnistcodeblock1
    container:
      image: docker.io/lstiphout/mnist:01 # Your docker image name
      command: ["/bin/sh", "-c"]
      args:
        - "python /app/src/main.py"
